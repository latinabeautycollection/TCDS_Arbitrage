# Paths and the working directory are adapted to this repository: the
# application lives in tcds-domain6-v3/tcds_v23_work.
name: Domain 6.2C Scandit Policy Certification

on:
  workflow_dispatch:
    inputs:
      domain6_2b_baseline_sha:
        description: "Full 40-character approved 6.2B baseline SHA"
        required: false
        type: string
      domain6_2c_baseline_sha:
        description: "Full 40-character SHA after certified 6.2B and before 6.2C"
        required: false
        type: string
  # No path filter: this workflow is intended to be a required check, and a
  # path-filtered workflow never reports a result on pull requests that do not
  # touch those paths.
  pull_request:

jobs:
  policy-certify:
    name: 6.2C policy certification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcds-domain6-v3/tcds_v23_work
    env:
      # scandit:policy:certify runs the 6.2B capture chain first, so both
      # baselines are required. The 6.2B baseline is the approved production
      # baseline for the capture slice; a repository variable of the same name
      # overrides it without editing this workflow. The 6.2C baseline is the
      # commit immediately before the 6.2C policy overlay, which on a pull
      # request is the base commit of that pull request.
      DOMAIN6_2B_BASELINE_SHA: ${{ inputs.domain6_2b_baseline_sha || vars.DOMAIN6_2B_BASELINE_SHA || '675b89bbf859f71e3507731f6bfd8c8b727c180d' }}
      DOMAIN6_2C_BASELINE_SHA: ${{ inputs.domain6_2c_baseline_sha || github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tcds-domain6-v3/tcds_v23_work/package-lock.json

      # Certification fails closed: a missing, malformed or unreachable
      # baseline stops the run before any check can report a false pass.
      - name: Validate both baseline SHAs
        shell: bash
        run: |
          set -euo pipefail
          for name in DOMAIN6_2B_BASELINE_SHA DOMAIN6_2C_BASELINE_SHA; do
            value="${!name:-}"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$name must be a full 40-character SHA"
              exit 1
            fi
            if ! git cat-file -e "${value}^{commit}"; then
              echo "::error::$name does not resolve to a commit in this checkout"
              exit 1
            fi
            echo "$name=$value"
          done

      - run: npm ci

      # The Scandit runtime files are generated from the approved package and
      # are not committed, so a clean checkout has to produce them before the
      # runtime and parity checks can run.
      - run: npm run scandit:prepare

      # One command proves all three slices together: 6.2A version, runtime,
      # cache, boundary, lint and dist checks; the 6.2B capture chain with its
      # own boundary, protected-feature, strict TypeScript and unit checks; then
      # the 6.2C policy manifest, boundary, strict TypeScript and unit checks,
      # and the production build.
      - run: npm run scandit:policy:certify

      # The policy manifest is generated by the chain above and is never
      # committed. This step proves the generated file describes the policy
      # sources in this checkout exactly, and is reproducible.
      - name: Verify the generated policy manifest
        shell: bash
        run: |
          set -euo pipefail
          cp domain6-2c-policy-manifest.json /tmp/policy-manifest-first.json
          npm run scandit:policy:manifest
          cmp /tmp/policy-manifest-first.json domain6-2c-policy-manifest.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";

          const manifest = JSON.parse(
            fs.readFileSync("domain6-2c-policy-manifest.json", "utf8"),
          );

          const sources = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith(".ts")) sources.push(full);
            }
          };
          walk("src/lib/scanning/policy");

          const problems = [];
          for (const file of sources.sort()) {
            const record = manifest.files[file];
            if (!record) {
              problems.push(`${file}: missing from the generated manifest`);
              continue;
            }
            const data = fs.readFileSync(file);
            const sha = crypto.createHash("sha256").update(data).digest("hex");
            if (record.sha256 !== sha || record.bytes !== data.length) {
              problems.push(`${file}: manifest entry does not match the source`);
            }
          }
          for (const recorded of Object.keys(manifest.files)) {
            if (!sources.includes(recorded)) {
              problems.push(`${recorded}: recorded but no longer a policy source`);
            }
          }

          if (problems.length) {
            for (const problem of problems) console.error(` - ${problem}`);
            process.exit(1);
          }
          console.log(
            `Policy manifest verified against ${sources.length} policy sources`,
          );
          NODE
          sha256sum domain6-2c-policy-manifest.json

      - name: Retain the policy manifest as a certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain6-2c-policy-manifest
          path: tcds-domain6-v3/tcds_v23_work/domain6-2c-policy-manifest.json
          if-no-files-found: error

      - run: npm run check --if-present
      - run: npm run verify --if-present
